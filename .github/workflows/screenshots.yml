name: Screenshots

on:
  push:
    paths:
      - "TelenetRemote/**"
      - "project.yml"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
      - name: Build app
        run: |
          xcodebuild -project TelenetRemote.xcodeproj -scheme TelenetRemote \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Take screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/TelenetRemote.app
          BUNDLE=be.telenetremote.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" $BUNDLE 2>/dev/null || true
            xcrun simctl launch "$UDID" $BUNDLE "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shot 1-aanmelden
          shot 2-afstandsbediening -demo
          shot 3-touchpad -demo -useTouchpad YES
          shot 4-zenders -demo -demoSheet channels
          shot 5-cijfers -demo -demoSheet numbers
          shot 6-instellingen -demo -demoSheet settings
          ls -la screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Screenshots bijwerken [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
