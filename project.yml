name: TelenetRemote
options:
  bundleIdPrefix: be.telenetremote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TelenetRemote:
    type: application
    platform: iOS
    sources:
      - path: TelenetRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.telenetremote.app
        INFOPLIST_FILE: TelenetRemote/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Vul je eigen Apple Developer Team ID in (of kies het team in Xcode)
        DEVELOPMENT_TEAM: ""
